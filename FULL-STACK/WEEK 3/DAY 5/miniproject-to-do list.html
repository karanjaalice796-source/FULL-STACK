<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>To Do List</title>
	<link rel="stylesheet" href="miniproject-to-do list.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
	<main class="todo-app">
		<h1>To Do List</h1>
		<form id="taskForm">
			<label class="sr-only" for="taskInput">New task</label>
			<input id="taskInput" name="task" type="text" placeholder="Add a new task" autocomplete="off">
			<button type="submit">Submit</button>
		</form>
		<div class="listTasks"></div>
	</main>

	<script src="miniproject-to-do list.js"></script>
</body>
</html>
