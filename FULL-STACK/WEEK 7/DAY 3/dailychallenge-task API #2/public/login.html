<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <style>
    body { max-width: 28rem; margin: 3rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; color: #202923; }
    form { display: grid; gap: 1rem; }
    label { display: grid; gap: .35rem; }
    input, button { box-sizing: border-box; width: 100%; padding: .7rem; font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    #message { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Log in</h1>
    <form id="login-form">
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" disabled>Log in</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <p>Need an account? <a href="/register.html">Register</a></p>
  </main>
  <script>
    const form = document.querySelector('#login-form');
    const submitButton = form.querySelector('button[type="submit"]');
    const message = document.querySelector('#message');

    form.addEventListener('input', () => {
      submitButton.disabled = ![...form.querySelectorAll('input')].every((input) => input.value.trim());
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        const result = await response.json();
        message.textContent = result.message || result.error;
        message.dataset.state = response.ok ? 'success' : 'error';
      } catch {
        message.textContent = 'Unable to connect to the server.';
        message.dataset.state = 'error';
      }
      submitButton.disabled = ![...form.querySelectorAll('input')].every((input) => input.value.trim());
    });
  </script>
</body>
</html>
