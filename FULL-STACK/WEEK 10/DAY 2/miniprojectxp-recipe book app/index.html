<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f2" />
    <title>My Recipe Book</title>
  </head>
  <body>
    <main class="recipe-app">
      <header class="page-header">
        <p class="eyebrow">YOUR PERSONAL COLLECTION</p>
        <h1>My Recipe Book</h1>
        <p class="subtitle">Save the dishes you love and keep them close at hand.</p>
      </header>

      <section class="entry-panel" aria-labelledby="entryHeading">
        <h2 id="entryHeading">Add a recipe</h2>
        <form id="recipeEntryForm">
          <label for="recipeTitle">Recipe title</label>
          <input
            type="text"
            id="recipeTitle"
            placeholder="e.g. Sunday tomato pasta"
            maxlength="100"
            required
          />

          <label for="ingredients">Ingredients <span>(one per line)</span></label>
          <textarea
            id="ingredients"
            placeholder="200 g pasta&#10;2 cups tomatoes&#10;Fresh basil"
            rows="5"
            required
          ></textarea>

          <label for="instructions">Cooking instructions</label>
          <textarea
            id="instructions"
            placeholder="Write the steps for making this recipe..."
            rows="5"
            required
          ></textarea>

          <button class="primary-button" type="submit">Add recipe</button>
        </form>
      </section>

      <section class="collection-section" aria-labelledby="collectionHeading">
        <div class="collection-header">
          <div>
            <p class="eyebrow">ALL YOUR FAVORITES</p>
            <h2 id="collectionHeading">Your collection</h2>
          </div>
          <button id="clearRecipesButton" class="text-button" type="button">
            Clear all
          </button>
        </div>
        <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
        <div id="recipeContainer" class="recipe-grid" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
